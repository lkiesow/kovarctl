[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kovarctl"
version = "0.1.0"
description = "Control the lighting of KOVAR keyboards (ROYUAN YC500 firmware) on Linux"
readme = "README.md"
license = "MIT"
authors = [{ name = "Lars Kiesow", email = "lkiesow@uos.de" }]
requires-python = ">=3.13"
dependencies = ["click>=8"]
keywords = ["kovar", "keyboard", "rgb", "lighting", "hidraw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/lkiesow/kovarctl"
Issues = "https://github.com/lkiesow/kovarctl/issues"

[project.scripts]
kovarctl = "kovarctl.cli:main"

[tool.setuptools]
packages = ["kovarctl"]
